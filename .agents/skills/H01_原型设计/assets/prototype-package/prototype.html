<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H01 Prototype</title>
  <style>
    body{font:16px/1.5 system-ui;margin:0;background:#f6f7fb;color:#172033}
    *{box-sizing:border-box}html{overflow-wrap:anywhere}
    main{max-width:760px;margin:48px auto;padding:32px;background:#fff;border-radius:16px;min-width:0}
    button{font:inherit;min-width:44px;min-height:44px;padding:10px 16px;border:0;border-radius:10px;background:#315efb;color:#fff;cursor:pointer}
    input,select,textarea{font:inherit;font-size:16px;max-width:100%}
    @media(max-width:700px){main{margin:0;width:100%;min-height:100dvh;padding:24px 18px calc(24px + env(safe-area-inset-bottom));padding-top:calc(24px + env(safe-area-inset-top));border-radius:0}h1{font-size:26px}button{max-width:100%;white-space:normal}}
    #status{margin-top:16px;color:#526078}
  </style>
</head>
<body>
  <main>
    <h1>原型标题</h1>
    <p>替换为真实任务与信息层级。</p>
    <button data-event-id="primary_action">执行主要操作</button>
    <p id="status" aria-live="polite">ready</p>
  </main>
  <script>
    document.querySelector('[data-event-id="primary_action"]').addEventListener('click', () => {
      document.querySelector('#status').textContent = 'completed';
    });
  </script>
</body>
</html>
