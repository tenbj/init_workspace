<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H01 Prototype</title>
  <style>
    body{font:16px/1.5 system-ui;margin:0;background:#f6f7fb;color:#172033}
    main{max-width:760px;margin:48px auto;padding:32px;background:#fff;border-radius:16px}
    button{padding:10px 16px;border:0;border-radius:10px;background:#315efb;color:#fff;cursor:pointer}
    #status{margin-top:16px;color:#526078}
  </style>
</head>
<body>
  <main>
    <h1>原型标题</h1>
    <p>替换为真实任务与信息层级。</p>
    <button data-event-id="primary_action">执行主要操作</button>
    <p id="status" aria-live="polite">ready</p>
  </main>
  <script>
    document.querySelector('[data-event-id="primary_action"]').addEventListener('click', () => {
      document.querySelector('#status').textContent = 'completed';
    });
  </script>
</body>
</html>
